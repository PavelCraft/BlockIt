<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlockIt — promotional cards</title>
  <link rel="stylesheet" href="styles-v2.css">
</head>
<body>
  <main class="artboard" id="artboard">
    <div class="accent-grid" aria-hidden="true"></div>
    <header class="brand">
      <img src="source/icon.png" alt="">
      <strong>Block<span>It</span></strong>
      <em>YOUR RULES FOR EVERY PAGE</em>
    </header>
    <div class="number" id="number"></div>
    <section class="message">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="body" id="body"></p>
      <div class="pills" id="pills"></div>
    </section>
    <section class="visual" id="visual"></section>
    <footer class="signature"><span>You choose</span><i></i><span>BlockIt builds and applies the rule</span></footer>
  </main>
  <script src="cards-v2-en.js"></script>
</body>
</html>
