<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlockIt — рекламные карточки</title>
  <link rel="stylesheet" href="styles-v2.css">
</head>
<body>
  <main class="artboard" id="artboard">
    <div class="accent-grid" aria-hidden="true"></div>
    <header class="brand">
      <img src="source/icon.png" alt="">
      <strong>Block<span>It</span></strong>
      <em>СВОИ ПРАВИЛА ДЛЯ КАЖДОЙ СТРАНИЦЫ</em>
    </header>
    <div class="number" id="number"></div>
    <section class="message">
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="body" id="body"></p>
      <div class="pills" id="pills"></div>
    </section>
    <section class="visual" id="visual"></section>
    <footer class="signature"><span>Вы выбираете</span><i></i><span>BlockIt создаёт и применяет правило</span></footer>
  </main>
  <script src="cards-v2.js"></script>
</body>
</html>
