<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>BlockIt — промо-карточки</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="artboard" id="artboard">
    <div class="wash wash-a"></div>
    <div class="wash wash-b"></div>
    <div class="dots"></div>

    <header class="brand">
      <img src="source/icon.png" alt="">
      <strong>Block<span>It</span></strong>
      <em>УПРАВЛЕНИЕ СТРАНИЦАМИ</em>
    </header>

    <section class="message" id="message">
      <div class="number" id="number"></div>
      <p class="kicker" id="kicker"></p>
      <h1 id="title"></h1>
      <p class="body" id="body"></p>
      <div class="pills" id="pills"></div>
    </section>

    <section class="visual" id="visual"></section>

    <footer><span>Вы выбираете элементы</span><i></i><span>BlockIt создаёт и применяет правило</span></footer>
  </main>
  <script type="module" src="cards.js"></script>
</body>
</html>
